[package]
name = "truffledata-buffa"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
buffa = { version = "=0.9.2", default-features = false, features = ["std", "text"] }
bytes = "=1.11.1"

serde_json = "=1.0.154"

# Same CPU-dispatched Unicode implementation used by Myna values.
simdutf = "=0.7.0"
