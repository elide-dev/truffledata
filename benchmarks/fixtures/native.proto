syntax = "proto3";
package truffledata.benchdata;

message Native {
  optional int32 f0 = 1;
  double f1 = 2;
  bool f2 = 3;
  bytes f3 = 4;
  enum Status { ZERO = 0; }
  Status f4 = 5;
}

message Graph {
  int32 number = 1;
  double score = 2;
  bool active = 3;
  string name = 4;
  bytes payload = 5;
  Graph child = 6;
  repeated Graph children = 7;
}
