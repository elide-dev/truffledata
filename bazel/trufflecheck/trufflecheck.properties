# trufflecheck policy (third_party/trufflecheck, rules from dev.elide:trufflecheck-errorprone).
# Defaults: third_party/trufflecheck/policy/src/main/resources/META-INF/trufflecheck/policy.properties.
# Paths are relative to this file. Bazel passes it to javac as a //bazel:trufflecheck plugin input.

# Guest-language code must not use the polyglot embedding API. Tests and benchmarks embed TruffleData
# through polyglot on purpose (they are hosts, not guests).
hostinterop.scope=dev.elide.truffledata
hostinterop.exclude=(^|.*/)(tests|benchmarks)/.*

# Every image that ships or tests TruffleData initializes the library at build time
# (--initialize-at-build-time=dev.elide.truffledata); the benchmark drivers are the run-time exceptions.
classinit.buildtime=classinit-buildtime.txt
classinit.runtime=classinit-runtime.txt

# Test harnesses are hosts: a static uncached DataLibrary there is a fixture, not guest state.
contextstate.exclude=(^|.*/)(test|tests)/.*
