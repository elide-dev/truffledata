# Build and deploy configuration
name: ci
on:
  push:
    branches: [main, 'release/**']
  pull_request: {}
env:
  RUST_LOG: info  # verbosity
  TIMEOUT: 30
  RATIO: 0.75
  ENABLED: true
  EMPTY: ~
jobs:
  job-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        os: [linux, macos]
        version: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - name: Build step 0
        run: |
          bazel build //... --config=ci
          echo "done 0"
      - name: Test
        run: >-
          bazel test //... --test_output=errors
          --jobs=8
        env:
          SHARD: '0'
          RETRIES: 3
