[package]
name = "truffledata-json-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Links Myna's myna-values text bridge (myna_utf8_to_utf16_v2) into JSON SVM images"

[lib]
path = "lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
# Myna 0.10.0 (the release //bazel:myna.BUILD's archive pins); myna-values is not on crates.io.
myna-values = { git = "https://github.com/elide-dev/myna", rev = "092ffe3d2d5818dda3712cdb3be5bf9390f7436e" }
