name: Check - Database drivers
on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      BUILDBUDDY_APIKEY:
        required: false
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  test:
    name: MySQL and PostgreSQL acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: truffledata
          POSTGRES_DB: truffledata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d truffledata"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: truffledata
          MYSQL_DATABASE: truffledata
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptruffledata --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk for repository extraction
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_APIKEY) || '' }}
        run: .github/scripts/configure-buildbuddy.sh
      - name: Install Bazelisk
        run: .github/scripts/install-bazelisk.sh
      - name: Real driver acceptance
        id: tests
        env:
          TRUFFLEDATA_MYSQL_URL: "jdbc:mysql://127.0.0.1:3306/truffledata?user=root&password=truffledata&allowPublicKeyRetrieval=true&sslMode=DISABLED"
          TRUFFLEDATA_POSTGRESQL_URL: "jdbc:postgresql://127.0.0.1:5432/truffledata?user=postgres&password=truffledata"
        # Compile through RBE; the manual service test runs on the runner beside the databases.
        run: >-
          bazel test //tests:drivers --build_runfile_links --remote_download_toplevel --test_strategy=standalone --strategy=TestRunner=local
          --test_env=TRUFFLEDATA_MYSQL_URL --test_env=TRUFFLEDATA_POSTGRESQL_URL
      - name: Preserve JUnit results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/reports.py junit
      - name: Upload JUnit results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/junit.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: build/reports/junit.xml
          report_type: test_results
          disable_search: true
          flags: drivers
          fail_ci_if_error: true
      - name: Maven BOM consumer
        run: python3 tools/release/consumer.py
      - name: Remove BuildBuddy credentials
        if: always()
        run: rm -f user.bazelrc
      - name: Preserve reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-reports
          path: |
            build/reports/
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: warn
          retention-days: 14
