name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  bazel:
    name: Bazel
    uses: ./.github/workflows/check.bazel.yml
    secrets: inherit

  benchmarks:
    name: Benchmarks
    uses: ./.github/workflows/benchmarks.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
