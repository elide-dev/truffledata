name: Check - Buffa native backends
on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      BUILDBUDDY_APIKEY:
        required: false
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  test:
    name: Static SVM and Java fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_APIKEY) || '' }}
        run: .github/scripts/configure-buildbuddy.sh
      - name: Install Bazelisk
        run: .github/scripts/install-bazelisk.sh
      - name: Test static linkage and native-free fallback
        run: bazel test //protobuf-buffa/tests:native_test //protobuf-buffa/tests:fallback_test //benchmarks/comparison:native_smoke
      - name: Preserve JUnit
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/reports.py junit
      - name: Upload results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/junit.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: ${{ github.repository }}
          files: build/reports/junit.xml
          report_type: test_results
          disable_search: true
          flags: buffa-svm
          fail_ci_if_error: true
      - name: Remove BuildBuddy credentials
        if: always()
        run: rm -f user.bazelrc
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buffa-native-reports
          path: |
            build/reports/
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          retention-days: 14
