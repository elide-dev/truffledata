name: Check - Bazel
on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      BUILDBUDDY_APIKEY:
        required: false
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk for repository extraction
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_APIKEY) || '' }}
        run: .github/scripts/configure-buildbuddy.sh
      - name: Install Bazelisk
        run: .github/scripts/install-bazelisk.sh
      - name: Check reporting tools
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check Gazelle targets
        run: bazel run //bazel/gazelle:check
      - name: Build and test
        id: tests
        run: bazel test //...
      - name: Preserve JUnit results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/reports.py junit
      - name: JVM coverage
        id: coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: bazel coverage //tests:test //protobuf-buffa/tests:jvm //protobuf-buffa/tests:jvm_non_strict //protobuf-buffa/tests:jvm_views //protobuf-buffa/tests:jvm_views_strict //protobuf-buffa/tests:jvm_no_native_access //json/tests:jvm --config=codecov
      - name: Validate LCOV
        id: lcov
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: python3 .github/scripts/reports.py coverage
      - name: Enforce access-method coverage and report gaps
        if: ${{ !cancelled() && steps.lcov.outcome == 'success' }}
        run: python3 .github/scripts/coverage_contract.py
      - name: Upload JVM coverage to Codecov
        if: ${{ !cancelled() && steps.lcov.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: ${{ github.repository }}
          files: build/reports/coverage/lcov.info
          disable_search: true
          flags: jvm
          fail_ci_if_error: true
      - name: Upload JUnit results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/junit.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: ${{ github.repository }}
          files: build/reports/junit.xml
          report_type: test_results
          disable_search: true
          flags: jvm
          fail_ci_if_error: true
      - name: Remove BuildBuddy credentials
        if: always()
        run: rm -f user.bazelrc
      - name: Preserve reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bazel-reports
          path: |
            build/reports/
            bazel-out/_coverage/_coverage_report.dat
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
          if-no-files-found: warn
          retention-days: 14
