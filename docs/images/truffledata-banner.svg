<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">TruffleData</title>
  <desc id="desc">Schema-aware data access for GraalVM Truffle. Database rows, protobuf and objects flow through contracts into specialized guest access.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c31"/><stop offset="1" stop-color="#163c49"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#65e3cf"/><stop offset="1" stop-color="#a0c7ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a7dbe3" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1440" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="400" rx="24" fill="url(#grid)"/>
  <rect x="64" y="63" width="44" height="5" rx="2.5" fill="#65e3cf"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="145" fill="#f3f7fc" font-size="66" font-weight="750" letter-spacing="-2">TruffleData</text>
    <text x="67" y="194" fill="#c7d7e7" font-size="25">Schema-aware data access for GraalVM Truffle</text>
    <text x="67" y="244" fill="#87a8bc" font-size="19">Known contracts. Specialized reads. Explicit ownership.</text>
    <g font-size="14" font-weight="600" letter-spacing="1.2">
      <rect x="66" y="291" width="88" height="34" rx="17" fill="#274255"/>
      <text x="110" y="313" text-anchor="middle" fill="#d8e7f4">JVM</text>
      <rect x="166" y="291" width="148" height="34" rx="17" fill="#274255"/>
      <text x="240" y="313" text-anchor="middle" fill="#d8e7f4">NATIVE IMAGE</text>
      <rect x="326" y="291" width="100" height="34" rx="17" fill="#274255"/>
      <text x="376" y="313" text-anchor="middle" fill="#d8e7f4">ELIDE</text>
    </g>
    <g fill="none" stroke="#6297aa" stroke-width="2">
      <path d="M985 108H1024Q1040 108 1040 124V185H1090"/>
      <path d="M985 200H1090"/>
      <path d="M985 292H1024Q1040 292 1040 276V215H1090"/>
      <path d="M1190 200H1240" stroke="#65e3cf"/>
    </g>
    <g fill="#1c3347" stroke="#3d6175">
      <rect x="825" y="74" width="160" height="68" rx="12"/>
      <rect x="825" y="166" width="160" height="68" rx="12"/>
      <rect x="825" y="258" width="160" height="68" rx="12"/>
    </g>
    <g fill="#d3e1ed" font-size="18" text-anchor="middle">
      <text x="905" y="115">Database rows</text>
      <text x="905" y="207">Protobuf</text>
      <text x="905" y="299">Objects</text>
    </g>
    <rect x="1090" y="150" width="100" height="100" rx="20" fill="#234d56" stroke="#65e3cf" stroke-width="2"/>
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <path d="M1114 178H1166M1114 200H1166M1114 222H1142"/>
    </g>
    <text x="1140" y="284" text-anchor="middle" fill="#a1c9d2" font-size="16">Contracts</text>
    <rect x="1240" y="166" width="124" height="68" rx="12" fill="#65e3cf"/>
    <text x="1302" y="207" text-anchor="middle" fill="#123741" font-size="18" font-weight="700">Guest code</text>
  </g>
</svg>
