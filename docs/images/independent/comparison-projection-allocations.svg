  <g id="text_10">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start" x="18" y="18.363937" transform="rotate(-0 18 18.363937)">TruffleData development  |  Parse and project · peak allocations</text>
  </g>
  <g id="text_11">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(18 207.048425)">Median of three process medians; whiskers show min–max process medians, not confidence intervals.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(18 216.650612)">Shared Linux x86-64 SVM runner. SQL: decoder functions only; no server or transport.</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #465361" transform="translate(18 226.2528)">Current-thread Java heap only; native allocations are excluded. Both parsers can inline; no stock parser boundary. Revision: 4b4661c2689f.</text>
  </g>
