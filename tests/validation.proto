syntax = "proto3";
package truffledata.validation;
import "validate.proto";

message Sample {
  optional string name = 1 [(buf.validate.field).required = true,
    (buf.validate.field).string = { min_len: 2, max_len: 3 }];
  int32 small = 2 [(buf.validate.field).int32 = { gte: 0, lte: 127 }];
  repeated int32 numbers = 3 [(buf.validate.field).repeated = { min_items: 1, max_items: 3 }];
  bytes blob = 4 [(buf.validate.field).bytes.len = 2];
  map<string, int32> pairs = 5 [(buf.validate.field).map = { min_pairs: 1, max_pairs: 2 }];
  int32 excluded = 6 [(buf.validate.field).int32 = { gt: 10, lt: 0 }];
  int32 ignored = 7 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32.gte = 10];
  optional int32 present = 8 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32.gte = 10];
  optional string disabled = 9 [(buf.validate.field).ignore = IGNORE_ALWAYS,
    (buf.validate.field).required = true, (buf.validate.field).string.min_len = 10];
  bool nondefault = 10 [(buf.validate.field).required = true];
}
