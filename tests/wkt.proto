syntax = "proto3";
package truffledata.wkt;
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/any.proto";
import "google/protobuf/type.proto";
message Envelope {
  google.protobuf.Timestamp when = 1;
  google.protobuf.Int32Value count = 2;
  google.protobuf.Value value = 3;
  repeated google.protobuf.Value values = 4;
  repeated google.protobuf.Int32Value counts = 5;
  google.protobuf.Duration elapsed = 6;
  google.protobuf.FieldMask mask = 7;
  google.protobuf.Any payload = 8;
  google.protobuf.Field field = 9;
}
