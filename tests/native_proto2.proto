syntax = "proto2";
package truffledata.lossless;
message Legacy {
  optional int32 count = 1 [default = 42];
  optional string text = 2 [default = "hello"];
  enum Status { FIRST = 1; SECOND = 2; }
  optional Status status = 3 [default = SECOND];
  repeated Status statuses = 4 [packed = true];
  optional bytes blob = 5 [default = "\001\377"];
  optional uint64 big = 6 [default = 18446744073709551615];
  optional group Old = 7 { optional int32 value = 8; }
  enum MapStatus { MAP_ZERO = 0; MAP_ONE = 1; }
  map<string, MapStatus> states = 9;
}
message Required {
  required int32 count = 1;
  optional Required child = 2;
}
message FlatDefaults {
  required int32 count = 1;
  optional string text = 2 [default = "hello"];
  enum Status { FIRST = 1; SECOND = 2; }
  optional Status status = 3 [default = SECOND];
  optional bytes blob = 4 [default = "\001\377"];
  optional uint64 big = 5 [default = 18446744073709551615];
}
message DefaultGraph {
  optional FlatDefaults child = 1;
  repeated FlatDefaults children = 2;
  optional string text = 3 [default = "root"];
}
// Empty optional children still need eager representation when a descendant can be required.
message OptionalRequired {
  optional DefaultGraph child = 1;
}
